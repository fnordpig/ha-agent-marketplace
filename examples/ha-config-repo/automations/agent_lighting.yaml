- id: agent_hallway_motion_lighting
  alias: Agent - Hallway motion lighting
  description: Turn on hallway light when motion is detected and guest mode is off.
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.hallway_motion
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  action:
    - service: light.turn_on
      target:
        entity_id: light.hallway
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.hallway_motion
          to: "off"
          for: "00:02:00"
    - service: light.turn_off
      target:
        entity_id: light.hallway

